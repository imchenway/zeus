name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 执行与本地一致的发布前门禁
        env:
          ZEUS_VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ZEUS_VERIFY_HEAD: ${{ github.sha }}
        run: pnpm verify:publish
