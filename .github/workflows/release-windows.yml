# 独立 Windows 附件与补发入口，原生构建与统一发布复用。
name: Release Windows

on:
  workflow_dispatch:
    inputs:
      # 候选必须固定，重试不能悄悄换为后续 main。
      commit_sha:
        description: 要构建的 40 位固定候选提交
        required: true
      # 上传只使用已有稳定 Release，不创建或移动标签。
      tag:
        description: 与候选 package.json 一致的目标标签
        required: true
      publish_release:
        description: 上传正式 Zeus Windows 安装器到已有稳定 Release，签名状态按实际凭据记录
        required: true
        type: boolean
        default: false
      # 任务交付独立生成安装器附件，不要求创建或修改公开 Release。
      build_installers:
        description: 生成正式 Zeus 安装器附件，无证书时生成未签名正式包
        required: true
        type: boolean
        default: false

# 非发布作业只有读取权限，资产写入只授予最后的发布作业。
permissions:
  contents: read

# 同一标签只允许一个 Windows 发布流程，避免两个候选争用资产。
concurrency:
  group: release-windows-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    # 只允许官方仓库使用发行凭据。
    if: ${{ github.repository == 'imchenway/zeus' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}
      - name: 校验正式分发身份和 OSS 配置
        if: ${{ inputs.publish_release }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          # 补发与主发布使用相同的官方分发目标。
          ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          ALIYUN_ROLE_ARN: ${{ vars.ALIYUN_ROLE_ARN }}
          ZEUS_OSS_BUCKET: ${{ vars.ZEUS_OSS_BUCKET }}
          ZEUS_OSS_REGION: ${{ vars.ZEUS_OSS_REGION }}
          ZEUS_DOWNLOAD_BASE_URL: ${{ vars.ZEUS_DOWNLOAD_BASE_URL }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '正式补发的 OIDC 身份只允许 main 分支。' >&2
            exit 1
          fi
          node scripts/publish-release-cdn.mjs validate
      - name: 核对固定候选与版本
        env:
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[a-f0-9]{40}$' || [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]; then
            echo 'Windows 构建必须使用完整、准确的候选提交。' >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$(node -p "require('./package.json').version")" ]; then
            echo 'Windows 目标标签与候选版本不一致。' >&2
            exit 1
          fi
      - name: 核对已有稳定发行
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          remote_tag_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          if [ -z "$remote_tag_commit" ]; then
            remote_tag_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          fi
          if [ "$remote_tag_commit" != "$RELEASE_COMMIT" ]; then
            echo 'Windows 发布要求已有标签精确指向本次候选。' >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease |
            jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false'

  # Windows 静态检查独立执行，不能依赖另一条发行流程的状态。
  verify:
    # 任务附件只执行构建所需步骤，公开发布保留已有静态门禁。
    if: ${{ !inputs.build_installers || inputs.publish_release }}
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  # 与统一发布共用同一套 Windows 原生构建，独立入口保留附件与编译模式。
  package-windows:
    needs: preflight
    uses: ./.github/workflows/build-windows-release.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      build_installers: ${{ inputs.build_installers || inputs.publish_release }}
      use_task_cache: ${{ inputs.build_installers && !inputs.publish_release }}
    secrets:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

  # 只追加本平台资产；macOS 发布、Release notes 和 Homebrew 均由原有流程维护。
  publish:
    if: ${{ inputs.publish_release }}
    needs: [preflight, verify, package-windows]
    runs-on: ubuntu-latest
    # 两个发布入口共用串行组，稳定清单不会被并发补发覆盖。
    concurrency:
      group: zeus-stable-release-distribution
      cancel-in-progress: false
    permissions:
      contents: write
      # 只有正式分发作业能申请短期阿里云身份。
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      # 非密钥配置复用仓库 Variables。
      ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
      ALIYUN_ROLE_ARN: ${{ vars.ALIYUN_ROLE_ARN }}
      ZEUS_OSS_BUCKET: ${{ vars.ZEUS_OSS_BUCKET }}
      ZEUS_OSS_REGION: ${{ vars.ZEUS_OSS_REGION }}
      ZEUS_DOWNLOAD_BASE_URL: ${{ vars.ZEUS_DOWNLOAD_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 下载两个原生架构的正式安装器
        uses: actions/download-artifact@v4
        with:
          pattern: zeus-windows-${{ inputs.commit_sha }}-*
          path: dist
          merge-multiple: true
      - name: 合并并复核官方 Windows 清单
        run: node scripts/assemble-windows-release.mjs dist
      - name: 重新核对标签与稳定发行
        run: |
          remote_tag_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          if [ -z "$remote_tag_commit" ]; then
            remote_tag_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          fi
          if [ "$remote_tag_commit" != "$RELEASE_COMMIT" ]; then
            echo '构建期间目标标签已变化，未上传 Windows 产物。' >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease |
            jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false'
      - name: 复用同版 macOS 制品以提供完整 CDN 下载链接
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release download "$RELEASE_TAG" --repo imchenway/zeus --pattern "Zeus-$version-arm64.dmg" --pattern zeus-release-manifest.json --dir dist
      - name: 安装固定版本 OSS 上传工具
        run: |
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 120 'https://gosspublic.alicdn.com/ossutil/v2/2.4.1/ossutil-2.4.1-linux-amd64.zip' -o "$RUNNER_TEMP/zeus-ossutil.zip"
          printf '57ee4c56796a40144acd6b0b96b53b4ba75e5cec09c01d8d0313c09a5524022f  %s\n' "$RUNNER_TEMP/zeus-ossutil.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/zeus-ossutil.zip" -d "$RUNNER_TEMP/zeus-ossutil"
          chmod 755 "$RUNNER_TEMP/zeus-ossutil/ossutil-2.4.1-linux-amd64/ossutil"
          printf '%s\n' "$RUNNER_TEMP/zeus-ossutil/ossutil-2.4.1-linux-amd64" >> "$GITHUB_PATH"
      - name: 申请阿里云短期上传身份
        id: oss_identity
        # 官方 MIT Action 固定到不可变提交。
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIYUN_ROLE_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 1800
      - name: 准备并核验 CDN 固定版本制品
        env:
          # 上传只使用本次 OIDC 换取的短期凭据。
          OSS_ACCESS_KEY_ID: ${{ steps.oss_identity.outputs.aliyun-access-key-id }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.oss_identity.outputs.aliyun-access-key-secret }}
          OSS_SESSION_TOKEN: ${{ steps.oss_identity.outputs.aliyun-security-token }}
        run: |
          node scripts/publish-release-cdn.mjs stage dist
      - name: 上传并核对 Windows 资产，最后公开更新清单
        run: |
          version="$(node -p "require('./package.json').version")"
          # 同名资产只核对，不覆盖；上传结果未知时停止，后续显式重跑先读取现有事实。
          # 两个安装器都通过服务器摘要核对后才上传清单，部分失败不会宣布 Windows 可更新。
          for local_asset in "dist/Zeus-$version-win32-x64.exe" "dist/Zeus-$version-win32-arm64.exe" dist/zeus-release-manifest-win32.json; do
            name="$(basename "$local_asset")"
            digest="sha256:$(sha256sum "$local_asset" | awk '{print $1}')"
            size="$(stat -c '%s' "$local_asset")"
            release_json="$(gh release view "$RELEASE_TAG" --json assets)"
            if ! printf '%s' "$release_json" | jq -e --arg name "$name" '.assets | any(.name == $name)' >/dev/null; then
              gh release upload "$RELEASE_TAG" "$local_asset"
            fi
            gh release view "$RELEASE_TAG" --json assets |
              jq -e --arg name "$name" --arg digest "$digest" --argjson size "$size" '.assets | map(select(.name == $name)) | length == 1 and (.[0].digest == $digest and .[0].size == $size)' >/dev/null
          done
          echo "Windows 两个架构和更新清单已核对：$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: 刷新稳定清单写入身份
        id: oss_activate_identity
        # 官方 MIT Action 固定到不可变提交。
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIYUN_ROLE_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 1800
      - name: 核对发布正文并激活 CDN 稳定清单
        env:
          # 上传只使用本次 OIDC 换取的短期凭据。
          OSS_ACCESS_KEY_ID: ${{ steps.oss_activate_identity.outputs.aliyun-access-key-id }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.oss_activate_identity.outputs.aliyun-access-key-secret }}
          OSS_SESSION_TOKEN: ${{ steps.oss_activate_identity.outputs.aliyun-security-token }}
        run: |
          gh release edit "$RELEASE_TAG" --repo imchenway/zeus --notes-file "releases/$RELEASE_TAG.md"
          node scripts/publish-release-cdn.mjs activate dist
