name: Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 要构建的固定候选提交；公开发布时必须是 origin/main 当前提交
        required: false
        default: ''
      tag:
        description: 目标 Git tag；检查和打包通过后才创建
        required: false
        default: ''
      publish_release:
        description: 发布 GitHub Release 并同步 imchenway/homebrew-tap
        required: true
        type: boolean
        default: false
      require_apple_distribution:
        description: 非公开候选也强制 Developer ID 签名和 Apple 公证；公开发布始终强制
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag != '' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: 检出固定发布候选
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.ref }}
      - name: 校验公开发布输入、目标占用与必要凭据
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if ! printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "公开发布要求固定的 40 位候选提交：${RELEASE_COMMIT:-empty}" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]; then
            echo "检出提交与候选提交不一致：expected=$RELEASE_COMMIT actual=$(git rev-parse HEAD)" >&2
            exit 1
          fi
          if [ "$(git ls-remote origin refs/heads/main | awk '{print $1}')" != "$RELEASE_COMMIT" ]; then
            echo '公开发布候选必须精确等于 origin/main，拒绝发布漂移或未推送提交。' >&2
            exit 1
          fi
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "公开发布要求目标 tag 与 package.json 版本一致：expected=$expected_tag actual=${RELEASE_TAG:-empty}" >&2
            exit 1
          fi
          remote_tag_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          if [ -z "$remote_tag_commit" ]; then
            remote_tag_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          fi
          if [ -n "$remote_tag_commit" ] && [ "$remote_tag_commit" != "$RELEASE_COMMIT" ]; then
            echo "目标 tag 已指向其他提交：tag=$RELEASE_TAG expected=$RELEASE_COMMIT actual=$remote_tag_commit" >&2
            exit 1
          fi
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo '公开发布缺少 Developer ID 证书或证书密码；为保持 macOS 隐私授权身份稳定，禁止发布 ad-hoc 产物。' >&2
            exit 1
          fi
          if ! { [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; } &&
             ! { [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; }; then
            echo '公开发布缺少完整公证凭据。' >&2
            exit 1
          fi
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo '公开 Homebrew 发布缺少 HOMEBREW_TAP_TOKEN。' >&2
            exit 1
          fi

  typecheck:
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 执行阻塞级 TypeScript 检查
        run: pnpm typecheck

  package-mac:
    needs: preflight
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      ZEUS_REQUIRE_DISTRIBUTABLE_RELEASE: ${{ (inputs.publish_release || inputs.require_apple_distribution) && '1' || '0' }}
    steps:
      - name: 检出固定发布候选
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 恢复 Electron 构建缓存
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: zeus-electron-macos-${{ runner.arch }}-${{ hashFiles('apps/desktop/electron-builder.yml', 'pnpm-lock.yaml') }}
      - name: 准备 App Store Connect API Key
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: 正式打包并执行致命产物校验
        env:
          ZEUS_FAST_RELEASE: '1'
          ZEUS_RELEASE_OUTPUT_DIR: dist
        run: pnpm verify:release
      - name: 上传已校验正式产物
        id: upload_release_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: zeus-macos-${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}
          path: |
            dist/Zeus-*.dmg
            dist/zeus-release-manifest.json
            dist/homebrew/zeus.rb
      - name: 首次上传失败后安全重试一次
        if: ${{ steps.upload_release_artifact.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: zeus-macos-${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}
          path: |
            dist/Zeus-*.dmg
            dist/zeus-release-manifest.json
            dist/homebrew/zeus.rb
          overwrite: true

  publish:
    if: ${{ inputs.publish_release }}
    needs: [preflight, typecheck, package-mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      RELEASE_COMMIT: ${{ inputs.commit_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: 检出固定发布候选
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}
      - name: 检出 Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: imchenway/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: .tmp/homebrew-tap
      - name: 下载已校验正式产物
        uses: actions/download-artifact@v4
        with:
          name: zeus-macos-${{ inputs.commit_sha }}
          path: dist
      - name: 检查或创建不可变标签
        run: |
          remote_tag_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          if [ -z "$remote_tag_commit" ]; then
            remote_tag_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          fi
          if [ -n "$remote_tag_commit" ]; then
            if [ "$remote_tag_commit" != "$RELEASE_COMMIT" ]; then
              echo "目标 tag 已指向其他提交：tag=$RELEASE_TAG expected=$RELEASE_COMMIT actual=$remote_tag_commit" >&2
              exit 1
            fi
            echo "目标 tag 已正确存在，无需重复创建：$RELEASE_TAG"
            exit 0
          fi
          git config user.name 'Zeus Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Zeus $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: 发布或核对 GitHub Release
        run: |
          version="$(node -p "require('./package.json').version")"
          local_dmg="$(node -e "const m=require('./dist/zeus-release-manifest.json'); const a=m.artifacts?.find((x)=>x.kind==='dmg'); if(!a) process.exit(1); process.stdout.write('dist/'+a.fileName)")"
          release_notes_file="docs/releases/${RELEASE_TAG}.md"
          if [ ! -s "$release_notes_file" ]; then
            echo "公开发布缺少面向用户的 Release notes：$release_notes_file" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true" ]; then
              echo "同名 GitHub Release 仍是草稿，拒绝同步 Homebrew Tap：$RELEASE_TAG" >&2
              exit 1
            fi
            local_digest="sha256:$(sha256sum "$local_dmg" | awk '{print $1}')"
            remote_digest="$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"$(basename "$local_dmg")\") | .digest")"
            if [ -z "$remote_digest" ] || [ "$local_digest" != "$remote_digest" ]; then
              echo "既有 Release 的 DMG 摘要与本次构建不一致：tag=$RELEASE_TAG" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              dist/Zeus-*.dmg \
              dist/zeus-release-manifest.json \
              --verify-tag \
              --title "Zeus $RELEASE_TAG" \
              --notes-file "$release_notes_file"
          fi
          echo "Zeus $version GitHub Release 已就绪。"
      - name: 同步 Homebrew Cask
        run: |
          mkdir -p .tmp/homebrew-tap/Casks
          cp dist/homebrew/zeus.rb .tmp/homebrew-tap/Casks/zeus.rb
          cd .tmp/homebrew-tap
          if [ -z "$(git status --porcelain -- Casks/zeus.rb)" ]; then
            echo 'Homebrew Cask 已是当前版本，无需提交。'
            exit 0
          fi
          git diff --check
          git config user.name 'Zeus Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Casks/zeus.rb
          git commit -m "更新 Zeus $(ruby -ne 'puts $1 if $_ =~ /version \"([^\"]+)\"/' Casks/zeus.rb) Cask"
          git push origin HEAD:main
