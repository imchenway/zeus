name: Read Zeus fault report

on:
  workflow_dispatch:
    inputs:
      report_id:
        description: Zeus fault report UUID
        required: true
        type: string
      recipient_key:
        description: One-use RSA public key (base64 DER)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  read:
    # 只有已登记仓库的 main 作业可申请诊断身份，环境还独立限制部署分支。
    if: github.repository == 'imchenway/zeus' && github.ref == 'refs/heads/main'
    environment: zeus-diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-release-oss
      - name: 申请诊断只读身份
        id: identity
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ZEUS_DIAGNOSTICS_ROLE_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 900
      - name: 读取并加密原始报告
        env:
          REPORT_ID: ${{ inputs.report_id }}
          REPORT_RECIPIENT_KEY: ${{ inputs.recipient_key }}
          OSS_ACCESS_KEY_ID: ${{ steps.identity.outputs.aliyun-access-key-id }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.identity.outputs.aliyun-access-key-secret }}
          OSS_SESSION_TOKEN: ${{ steps.identity.outputs.aliyun-security-token }}
        run: node scripts/read-fault-report.mjs --seal
      - name: 回传加密原包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zeus-fault-report
          path: ${{ runner.temp }}/zeus-fault-report.sealed.json
          retention-days: 1
          if-no-files-found: error
