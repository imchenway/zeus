appId: dev.hypha.zeus
productName: Zeus
artifactName: Zeus-${version}-${arch}.${ext}
# Electron 版本由根 package.json 指定，打包入口显式传递，避免产物继续使用旧版本。
directories:
  output: ../../dist
# 相应源码和许可证由两端共用的打包入口随应用提供。
beforePack: ../../scripts/stage-corresponding-source.mjs
files:
  - dist/**
  - assets/**
  - package.json
  - '!dist/**/*.map'
  - '!dist/**/*.d.ts'
  - '!dist/**/*.d.cts'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.{ts,tsx,cts,mts}'
  - '!node_modules/**/{CHANGELOG,HISTORY,CONTRIBUTING,README}*'
  - '!node_modules/**/{coverage,example,examples,test,tests}/**'
  - '!node_modules/*/{doc,docs}/**'
  - '!node_modules/@*/*/{doc,docs}/**'
  # 官方 Pi SDK 的导入链包含终端模块，保留完整运行文件以避免打包后缺失依赖。
  - '!node_modules/node-pty/binding.gyp'
  - '!node_modules/node-pty/{deps,scripts,src,typings}/**'
  # 保留对应依赖包提供的原生平台文件，由 Electron ABI rebuild 选择当前目标。
  - '!node_modules/node-pty/lib/**/*.test.js'
  - '!node_modules/node-pty/lib/testUtils.test.js'
asarUnpack:
  # Windows ConPTY 的 DLL 和辅助 exe 与 .node 必须同时使用物理路径。
  - node_modules/node-pty/**
  - dist/native/**
  # CUA 原生渲染器直接读取已编译主题，需要真实文件路径。
  - assets/computer-cursor/*.cua-theme
  # SDK 与绑定从物理目录解析依赖，原生 dlopen 不能使用 ASAR 虚拟路径。
  - node_modules/@trycua/cua-driver/**
  - node_modules/@trycua/cua-driver-*/**
  - node_modules/@ubjs/**
  # Copilot SDK 的原生 CLI 和 koffi 绑定从真实文件路径启动。
  - node_modules/@github/copilot-sdk-*/**
  - node_modules/koffi/**
mac:
  # macOS 使用 .lproj 名称；Windows 保留完整 .pak 语言资源，避免原生控件因缺失资源崩溃。
  electronLanguages:
    - en
    - en_GB
    - zh_CN
    - zh_TW
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  minimumSystemVersion: '13.0'
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.inherit.plist
  target:
    - dir
dmg:
  title: Zeus
  artifactName: Zeus-${version}-${arch}.dmg
publish: null
