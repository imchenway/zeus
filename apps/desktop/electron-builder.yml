appId: dev.hypha.zeus
productName: Zeus
artifactName: Zeus-${version}-${arch}.${ext}
electronVersion: 42.4.0
directories:
  output: ../../dist
files:
  - dist/**
  - assets/**
  - package.json
extraResources:
  - from: ../../.tmp/codex-runtime/${arch}
    to: codex
    filter:
      - codex
      - manifest.json
  - from: ../../third_party/openai-codex/runtime.lock.json
    to: codex/runtime.lock.json
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.inherit.plist
  target:
    - dmg
    - zip
dmg:
  title: Zeus
  artifactName: Zeus-${version}-${arch}.dmg
publish: null
