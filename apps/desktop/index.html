<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: zeus-preview:; media-src 'self' zeus-preview:; frame-src zeus-preview:; font-src 'self' data:; connect-src 'self' zeus-preview: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <title>Zeus</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      /* 首屏未加载设置时跟随系统；已有主题标记时沿用明确选择。 */
      :root {
        color-scheme: light dark;
      }
      :root[data-zeus-theme='light'] {
        color-scheme: light;
      }
      :root[data-zeus-theme='dark'] {
        color-scheme: dark;
      }

      body {
        overflow: hidden;
        background: light-dark(#f7f8fa, #17191d);
      }

      .zeus-startup-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        user-select: none;
      }

      .zeus-startup-icon {
        width: 72px;
        height: 72px;
        animation: zeus-startup-pulse 1.4s ease-in-out infinite;
      }

      @keyframes zeus-startup-pulse {
        0%,
        100% {
          opacity: 0.76;
          transform: scale(0.98);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .zeus-startup-icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="zeus-startup-loader" aria-hidden="true">
        <!-- 与启动失败页共用透明底图标，保留原有圆角底板。 -->
        <img class="zeus-startup-icon" src="./dist/branding/startup-mark.png" alt="" tabindex="-1" draggable="false" />
      </div>
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
