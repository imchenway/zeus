<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 本地附件缩略图使用 Blob URL；仅图片来源放行，脚本与其他资源策略保持原约束。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: zeus-preview: zeus-source-preview: https:; media-src 'self' zeus-preview:; frame-src zeus-preview: zeus-source-preview:; font-src 'self' data:; connect-src 'self' zeus-preview: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <title>Zeus</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      /* 首屏未加载设置时跟随系统；已有主题标记时沿用明确选择。 */
      :root {
        color-scheme: light dark;
      }
      :root[data-zeus-theme='light'] {
        color-scheme: light;
      }
      :root[data-zeus-theme='dark'] {
        color-scheme: dark;
      }

      body {
        overflow: hidden;
        background: light-dark(#f7f8fa, #181818);
      }

      .zeus-startup-loader {
        box-sizing: border-box;
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        user-select: none;
        padding: 24px;
        color: light-dark(#24252b, #eeedf4);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }

      /* 与失败页采用同一字号，窄窗口保留状态和进度的阅读宽度。 */
      .zeus-startup-content {
        inline-size: min(336px, 100%);
      }

      .zeus-startup-content h1 {
        font-size: clamp(22px, 5vw, 28px);
        font-weight: 600;
        margin: 0 0 16px;
      }

      .zeus-startup-stage {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 4px 12px;
        font-size: 14px;
        margin: 0 0 10px;
      }

      .zeus-startup-stage [data-startup-step],
      [data-startup-elapsed] {
        color: light-dark(#565966, #b6b4c0);
        font-size: 12px;
      }

      [data-startup-elapsed] {
        margin: 10px 0 0;
        font-variant-numeric: tabular-nums;
      }

      /* 启动耗时未知，使用贯穿整条轨道的光带表示仍在处理。 */
      .zeus-startup-progress {
        --startup-accent: light-dark(#5747d0, #a89dff);
        --startup-highlight: light-dark(#4374e9, #79baff);
        block-size: 5px;
        border-radius: 5px;
        background: light-dark(#d9dae2, #45444c);
        overflow: hidden;
      }

      .zeus-startup-progress::after {
        content: '';
        display: block;
        inline-size: 100%;
        block-size: 100%;
        /* 两端透明，光带完全离开轨道时再循环，避免往返减速和回跳。 */
        background: linear-gradient(90deg, transparent, var(--startup-accent) 42%, var(--startup-highlight) 62%, transparent);
        transform: translate3d(-100%, 0, 0);
        will-change: transform;
        animation: zeus-startup-working 1.8s linear infinite;
      }

      @keyframes zeus-startup-working {
        to {
          transform: translate3d(100%, 0, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .zeus-startup-progress::after {
          animation: none;
          transform: none;
          will-change: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="zeus-startup-loader">
        <section class="zeus-startup-content" aria-labelledby="zeus-startup-title">
          <h1 id="zeus-startup-title">正在启动 Zeus</h1>
          <p class="zeus-startup-stage" role="status"><span id="zeus-startup-stage">正在检查本机数据</span><span data-startup-step>第 1 步，共 3 步</span></p>
          <div class="zeus-startup-progress" role="progressbar" aria-labelledby="zeus-startup-stage"></div>
          <p data-startup-elapsed>已等待 0 秒</p>
        </section>
      </div>
    </div>
    <script type="module" src="/src/renderer/bootstrap.ts"></script>
  </body>
</html>
