<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeus Browser QA</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #edf2f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: clamp(24px, 6vw, 72px);
        background:
          radial-gradient(circle at 12% 0%, rgb(72 118 255 / 16%), transparent 30rem),
          linear-gradient(180deg, #f8fafc 0%, #edf2f8 100%);
      }

      main {
        width: min(760px, 100%);
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #4263eb;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 7vw, 66px);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .lede {
        max-width: 640px;
        margin: 22px 0 34px;
        color: #5c687d;
        font-size: clamp(17px, 2.5vw, 21px);
        line-height: 1.7;
      }

      .panel {
        padding: clamp(24px, 5vw, 38px);
        border: 1px solid rgb(101 116 139 / 20%);
        border-radius: 24px;
        background: rgb(255 255 255 / 90%);
        box-shadow: 0 24px 70px rgb(35 48 78 / 12%);
        backdrop-filter: blur(18px);
      }

      .panel + .panel {
        margin-top: 22px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 20px;
        letter-spacing: -0.02em;
      }

      .hint {
        margin: 0 0 22px;
        color: #667085;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        gap: 9px;
        border: 0;
        border-radius: 12px;
        padding: 0 18px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .primary {
        color: white;
        background: #4263eb;
        box-shadow: 0 10px 24px rgb(66 99 235 / 24%);
      }

      .secondary {
        color: #344054;
        background: #eef2f7;
      }

      .selection {
        margin: 0;
        padding: 18px;
        border-left: 3px solid #4263eb;
        border-radius: 0 12px 12px 0;
        color: #344054;
        background: #f7f9fc;
        line-height: 1.8;
      }

      .region {
        min-height: 140px;
        display: grid;
        place-items: center;
        border: 1px dashed #8da2c0;
        border-radius: 16px;
        color: #667085;
        background:
          linear-gradient(90deg, rgb(66 99 235 / 5%) 1px, transparent 1px),
          linear-gradient(rgb(66 99 235 / 5%) 1px, transparent 1px);
        background-size: 18px 18px;
      }

      #status {
        min-height: 24px;
        margin: 18px 0 0;
        color: #4263eb;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">仓库内本地验收页</p>
      <h1>Zeus Browser QA</h1>
      <p class="lede">
        用于验证 Zeus 内置浏览器的元素批注、文本选区、区域拖选、Adjust 预览、编号恢复和截图提交。页面完全本地运行，不会发送网络请求。
      </p>

      <section class="panel" aria-labelledby="element-title">
        <h2 id="element-title">元素批注</h2>
        <p class="hint">开启“批注”后点击按钮。装饰图标带有 aria-hidden，锚点应落在语义 button 上。</p>
        <div class="actions">
          <button id="primary-action" class="primary" type="button">
            <span aria-hidden="true">✓</span>
            <span>提交设计建议</span>
          </button>
          <button id="secondary-action" class="secondary" type="button">次要操作</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="text-title">
        <h2 id="text-title">文本选区</h2>
        <p class="selection">
          选择这段文字后保存批注，提交上下文应包含选中文字、Range 偏移、矩形列表、附近文本和当前页面地址。
        </p>
      </section>

      <section class="panel" aria-labelledby="region-title">
        <h2 id="region-title">区域拖选</h2>
        <p class="hint">在下方网格中拖出一个矩形，验证区域轮廓与截图附件。</p>
        <div class="region">可拖选区域</div>
      </section>
    </main>

    <script>
      const status = document.querySelector("#status");
      document.querySelector("#primary-action").addEventListener("click", () => {
        status.textContent = "主操作已触发；页面没有发送任何网络请求。";
      });
      document.querySelector("#secondary-action").addEventListener("click", () => {
        status.textContent = "次要操作已触发。";
      });
    </script>
  </body>
</html>
